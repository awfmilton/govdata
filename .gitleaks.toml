# Gitleaks configuration. Extends the upstream default ruleset and adds a
# small allowlist for the placeholder constants the unit-test bootstrap needs.

[extend]
useDefault = true

[[allowlists]]
description = "PublicTech test bootstrap constants and README placeholders"
paths = [
  '''tests/php/bootstrap\.php$''',
  '''tests/php/bootstrap-phpstan\.php$''',
  '''README\.md$''',
  '''publictech-core/inc/class-access-tiers\.php$''',
]
regexes = [
  '''pt-test-key''',
  '''pt-test-salt''',
  '''pass'\s*=>\s*'\.\.\.''',
]

# Shared DEVELOPMENT database password, committed intentionally (see the file
# header) so the riding-cache feature runs with zero setup during development.
# MUST be rotated and moved out of the repo before production.
[[allowlists]]
description = "PublicTech development DB credentials (rotate before production)"
paths = [
  '''database/mu-plugins/00-db-connections\.php$''',
]
