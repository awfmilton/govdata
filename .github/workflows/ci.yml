name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same branch — saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # Hard checks: required to pass.
  # =========================================================================

  # PHP syntax across every .php file in the suite. No deps required.
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Lint
        run: |
          set -e
          find publictech-core publictech-terminal publictech-mcp tests \
            -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || (cat /tmp/lint.log; exit 1)
          ! grep -q "Errors parsing" /tmp/lint.log
          echo "All PHP files parse on PHP ${{ matrix.php }}."

  # PHPUnit unit suite. Isolated install so the suite is not held hostage by
  # any unrelated dev-dep resolution issue in the repo's composer.json.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, intl, pdo_sqlite
          tools: composer:v2
      - name: Install phpunit (isolated workspace)
        run: |
          mkdir -p "$RUNNER_TEMP/phpunit-ws"
          cd "$RUNNER_TEMP/phpunit-ws"
          composer init --no-interaction --name=pt/ci --type=project --quiet
          composer require --dev --no-progress --no-interaction --no-plugins \
            phpunit/phpunit:^10.5
      - name: Run tests
        run: "$RUNNER_TEMP/phpunit-ws/vendor/bin/phpunit -c phpunit.xml.dist --no-coverage --testdox"

  # JS syntax across every .js file.
  js-syntax:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          set -e
          find publictech-core publictech-terminal -name '*.js' \
            -exec node --check {} \;

  # Theme / plugin headers + ABSPATH guards. Cheap, deterministic.
  theme-metadata:
    name: Theme metadata sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: |
          set -e
          for theme in publictech-core publictech-terminal; do
            test -f "$theme/style.css"
            grep -q "Theme Name:" "$theme/style.css"
            grep -q "Version:"    "$theme/style.css"
          done
          grep -q "Template: publictech-core" publictech-terminal/style.css
          grep -q "Plugin Name:" publictech-mcp/publictech-mcp.php

  # ESLint + Stylelint + Prettier. Pinned to versions known to work with the
  # @wordpress/eslint-plugin legacy config. These jobs use --no-save installs
  # so they don't depend on package.json drift.
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: |
          npm install --no-audit --no-fund --no-save \
            eslint@^8.57 \
            '@wordpress/eslint-plugin@^17' \
            stylelint@^16 \
            stylelint-config-standard@^36 \
            prettier@^3
      - name: ESLint
        run: npx eslint "publictech-core/assets/js/**/*.js" "publictech-terminal/assets/js/**/*.js"
      - name: Stylelint
        run: npx stylelint "publictech-core/assets/css/**/*.css" "publictech-terminal/assets/css/**/*.css"

  # NLP parser unit tests — runs PT.NLP.parseQuery() + intentToFilters() in a
  # minimal Node shim. No browser or server required. 35 test cases covering
  # all 5 bug-fix regressions and all known query patterns.
  nlp-tests:
    name: NLP parser unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run NLP tests
        run: node --test tests/js/nlp-parser.test.js
